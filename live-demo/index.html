<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主播推流</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="title">主播推流</header>
      <section class="card">
        <h2>画面预览</h2>
        <div class="actions">
          <button id="startButton" class="primary">◎ 开始推流</button>
          <button id="stopButton" disabled>◼ 停止推流</button>
        </div>
        <p id="message" class="message">ⓘ 点击开始推流后显示摄像头画面</p>
        <div class="preview">
          <video id="previewVideo" autoplay muted playsinline></video>
          <span id="placeholder">▰<br>点击开始推流后显示摄像头画面</span>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>

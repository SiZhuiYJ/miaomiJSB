<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
    <rect width="900" height="400" fill="#FFF9E8" rx="15" />

    <!-- 标题 -->
    <text x="450" y="40" text-anchor="middle" font-size="24" fill="#B34E4E" font-weight="bold">🎵
        Kinder Polka —— 画图书谱 🎵</text>

    <!-- 第一行：A段（小脚印） -->
    <text x="30" y="90" font-size="18" fill="#D2691E" font-weight="bold">A段：</text>
    <text x="80" y="90" font-size="14" fill="#555">活泼跳跃的脚步声 👣</text>

    <!-- 画12个小脚印，每拍一个，左右交替 -->
    <g transform="translate(30,110)">
        <circle cx="20" cy="0" r="12" fill="#FF8C42" />
        <text x="20" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="65" cy="0" r="12" fill="#F4A261" />
        <text x="65" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="110" cy="0" r="12" fill="#FF8C42" />
        <text x="110" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="155" cy="0" r="12" fill="#F4A261" />
        <text x="155" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="200" cy="0" r="12" fill="#FF8C42" />
        <text x="200" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="245" cy="0" r="12" fill="#F4A261" />
        <text x="245" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="290" cy="0" r="12" fill="#FF8C42" />
        <text x="290" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="335" cy="0" r="12" fill="#F4A261" />
        <text x="335" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="380" cy="0" r="12" fill="#FF8C42" />
        <text x="380" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="425" cy="0" r="12" fill="#F4A261" />
        <text x="425" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="470" cy="0" r="12" fill="#FF8C42" />
        <text x="470" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="515" cy="0" r="12" fill="#F4A261" />
        <text x="515" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <!-- 小节线 -->
        <line x1="560" y1="-20" x2="560" y2="20" stroke="#999" stroke-width="2" />
        <text x="580" y="5" font-size="14" fill="#888">⋯ 重复 ⋯</text>
    </g>

    <!-- 第二行：B段（波浪线） -->
    <text x="30" y="180" font-size="18" fill="#D2691E" font-weight="bold">B段：</text>
    <text x="80" y="180" font-size="14" fill="#555">柔和的摇摆 / 旋转 🌊</text>

    <g transform="translate(30,200)">
        <path d="M0,0 Q20,-20 40,0 T80,0 T120,0 T160,0 T200,0 T240,0 T280,0 T320,0 T360,0"
            stroke="#2A9D8F" stroke-width="5" fill="none" stroke-linecap="round" />
        <path d="M0,15 Q20,-5 40,15 T80,15 T120,15 T160,15 T200,15 T240,15 T280,15 T320,15 T360,15"
            stroke="#E9C46A" stroke-width="4" fill="none" stroke-linecap="round" />
        <!-- 飘带装饰 -->
        <circle cx="40" cy="-5" r="6" fill="#F4A261" />
        <circle cx="120" cy="-5" r="6" fill="#F4A261" />
        <circle cx="200" cy="-5" r="6" fill="#F4A261" />
        <circle cx="280" cy="-5" r="6" fill="#F4A261" />
        <text x="390" y="10" font-size="14" fill="#888">⋯ 延续 ⋯</text>
    </g>

    <!-- 第三行：再现A段（变化颜色） -->
    <text x="30" y="280" font-size="18" fill="#D2691E" font-weight="bold">再现A段：</text>
    <text x="150" y="280" font-size="14" fill="#555">（和A段一样，但颜色不同，表示重复中的变化）</text>

    <g transform="translate(30,300)">
        <circle cx="20" cy="0" r="12" fill="#9B5DE5" />
        <text x="20" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="65" cy="0" r="12" fill="#F15BB5" />
        <text x="65" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="110" cy="0" r="12" fill="#9B5DE5" />
        <text x="110" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="155" cy="0" r="12" fill="#F15BB5" />
        <text x="155" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="200" cy="0" r="12" fill="#9B5DE5" />
        <text x="200" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="245" cy="0" r="12" fill="#F15BB5" />
        <text x="245" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="290" cy="0" r="12" fill="#9B5DE5" />
        <text x="290" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="335" cy="0" r="12" fill="#F15BB5" />
        <text x="335" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="380" cy="0" r="12" fill="#9B5DE5" />
        <text x="380" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="425" cy="0" r="12" fill="#F15BB5" />
        <text x="425" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="470" cy="0" r="12" fill="#9B5DE5" />
        <text x="470" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
        <circle cx="515" cy="0" r="12" fill="#F15BB5" />
        <text x="515" y="5" text-anchor="middle" font-size="16" fill="white">👣</text>
    </g>

    <!-- 曲式结构标注 -->
    <rect x="30" y="345" width="820" height="40" fill="#FFE0B5" rx="10" />
    <text x="450" y="370" text-anchor="middle" font-size="16" fill="#B34E4E">
        🎶 曲式结构： [ A段 · 小脚印 ] → [ B段 · 波浪 ] → [ A'段 · 彩色脚印 ]
    </text>
</svg>